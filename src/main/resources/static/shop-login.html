<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopWizard 상점 로그인</title>
  <link rel="stylesheet" href="/css/app.css">
  <style>
    .login-form { display: flex; flex-direction: column; gap: 14px; }
    .login-form .btn { width: 100%; justify-content: center; padding: 10px; font-size: 15px; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-box">
      <div class="login-logo">
        <h1>ShopWizard</h1>
        <p>상점(거래처) 계정</p>
      </div>

      <div class="login-error" id="loginError"></div>

      <form class="login-form" id="loginForm">
        <div class="form-group">
          <label>로그인ID</label>
          <input class="input" type="text" id="loginId" placeholder="로그인ID를 입력하세요" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label>비밀번호</label>
          <input class="input" type="password" id="passwd" placeholder="비밀번호를 입력하세요" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">로그인</button>
      </form>
    </div>
  </div>

  <script src="/js/shop-auth.js"></script>
  <script>
    ShopAuth.requireGuest();   // 이미 로그인 중이면 shop-portal.html로 (비동기)

    const form      = document.getElementById('loginForm');
    const errBox    = document.getElementById('loginError');
    const loginBtn  = document.getElementById('loginBtn');

    form.addEventListener('submit', async e => {
      e.preventDefault();
      errBox.style.display = 'none';
      loginBtn.disabled = true;
      loginBtn.textContent = '로그인 중...';

      try {
        const res = await ShopAuth.login(
          document.getElementById('loginId').value.trim(),
          document.getElementById('passwd').value
        );

        if (res.success) {
          location.href = '/shop-portal.html';
        } else {
          errBox.textContent = res.message || '로그인에 실패했습니다.';
          errBox.style.display = 'block';
        }
      } catch (err) {
        errBox.textContent = '서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요.';
        errBox.style.display = 'block';
        console.error(err);
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = '로그인';
      }
    });
  </script>
</body>
</html>
