spring:
  datasource:
    # DB 호스트는 저장소에 두지 않는다(공개 저장소) — 환경변수 DB_HOST(예: host:3306), DB_PASSWORD 와 같이 run-server.bat/IDE 실행 설정에서 준다.
    url: jdbc:mysql://${DB_HOST}/wizardn?characterEncoding=utf-8&serverTimezone=Asia/Seoul
    username: wizardn
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3

  thymeleaf:
    cache: false

logging:
  level:
    com.shopwizard: DEBUG
    org.mybatis: DEBUG
    org.springframework: INFO
