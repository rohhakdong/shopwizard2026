spring:
  datasource:
    # DB 호스트는 저장소에 두지 않는다(공개 저장소) — 환경변수 DB_HOST(예: host:3306), DB_PASSWORD 로 준다.
    url: jdbc:mysql://${DB_HOST}/wizardn?characterEncoding=utf-8&serverTimezone=Asia/Seoul&useSSL=true
    username: wizardn
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  thymeleaf:
    cache: true

logging:
  level:
    com.shopwizard: INFO
    org.mybatis: WARN
    org.springframework: WARN
