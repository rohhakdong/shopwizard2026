spring:
  profiles:
    active: dev   # 기본 프로파일 (배포 시 prod로 변경)
  main:
    allow-bean-definition-overriding: true

  thymeleaf:
    encoding: UTF-8

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: false
    default-fetch-size: 100
    default-statement-timeout: 30

server:
  port: 3000
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
