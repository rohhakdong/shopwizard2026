spring:
  profiles:
    active: dev   # 기본 프로파일 (배포 시 prod로 변경)
  main:
    allow-bean-definition-overriding: true

  thymeleaf:
    encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: false
    default-fetch-size: 100
    default-statement-timeout: 30

server:
  port: 3000
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# 상품이미지 업로드 저장 경로. 상대경로면 애플리케이션 실행 위치(working directory) 기준이다.
