spring:
  profiles:
    active: dev   # 기본 프로파일 (배포 시 prod로 변경)
  main:
    allow-bean-definition-overriding: true

  thymeleaf:
    encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: false
    default-fetch-size: 100
    default-statement-timeout: 30

server:
  port: 3000
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    # 로그인 상태는 서버 세션(AuthSession)에 보관한다. 쿠키는 세션 ID 하나뿐이고 값 자체엔 계정 정보가 없다.
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax   # 크로스사이트 POST/PUT/DELETE 에 쿠키가 안 실려 CSRF 완화
        secure: ${SESSION_COOKIE_SECURE:false}   # HTTPS 로 서비스하는 운영환경에서는 true

# 상품이미지 업로드 저장 경로. 상대경로면 애플리케이션 실행 위치(working directory) 기준이다.
upload:
  dir: ${UPLOAD_DIR:uploads}

# 결제 PG 설정. enabled-pgs 는 새 결제에 쓸 PG(쉼표 구분, 순서 = 화면 표시 순서), default-pg 는 요청에 PG 가 없을 때의 기본값.
# 토스를 계약하면 TOSS_SECRET_KEY / TOSS_CLIENT_KEY 를 주고 PAYMENT_ENABLED_PGS=KCP,TOSS 처럼 켜면 된다(코드 변경 없음).
payment:
  enabled-pgs: ${PAYMENT_ENABLED_PGS:TOSS}
  default-pg: ${PAYMENT_DEFAULT_PG:}

# NHN KCP. 켜려면 PAYMENT_ENABLED_PGS=KCP (토스와 함께면 KCP,TOSS). 인증서·개인키는 저장소 밖 파일의 경로만 받고,
# 개인키 비밀번호는 환경변수로만 준다(run-server.bat 등 gitignore 대상). 켜진 상태에서 값이 틀리면 앱이 기동하지 않는다.
#  - test: 사이트코드 T0000 + KCP 공용 샘플 인증서(developer.kcp.co.kr), 승인/취소는 stg-spl, 실결제 없음
#  - prod: 발급받은 사이트코드(KCP_SITE_CD) + 발급 인증서/개인키, 승인/취소는 spl
kcp:
  mode: ${KCP_MODE:test}
  site-cd: ${KCP_SITE_CD:T0000}
  site-name: ${KCP_SITE_NAME:SHOPION}
  cert-path: ${KCP_CERT_PATH:}
  private-key-path: ${KCP_PRIVATE_KEY_PATH:}
  private-key-password: ${KCP_PRIVATE_KEY_PASSWORD:}

toss:
  client-key: ${TOSS_CLIENT_KEY:test_ck_6bJXmgo28e2KNmxGge1j3LAnGKWx}
  secret-key: ${TOSS_SECRET_KEY:test_sk_DnyRpQWGrNzDwJAdkJ1OrKwv1M9E}

shop:
  # shop.html(자사 쇼핑몰) 체크아웃 주문에 부여할 채널코드. 환경별로 다를 수 있어 설정으로 분리.
  chnl-code: ${SHOP_CHNL_CODE:1208674775Z2}

shoplinker:
  # 샵링커 협력사 주문수집 API. 일반몰은 order.php, 오픈마켓은 order2.php.
  # 별도 인증키 없이 경로(cooper/shopion) + 등록된 몰 아이디로 인가된다.
  order-url:      ${SHOPLINKER_ORDER_URL:http://ad2.shoplinker.co.kr/cooper/shopion/order.php}
  order2-url:     ${SHOPLINKER_ORDER2_URL:http://ad2.shoplinker.co.kr/cooper/shopion/order2.php}
  timeout-sec:    ${SHOPLINKER_TIMEOUT_SEC:60}
