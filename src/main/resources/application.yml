spring:
  profiles:
    active: dev   # 기본 프로파일 (배포 시 prod로 변경)
  main:
    allow-bean-definition-overriding: true

  thymeleaf:
    encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: false
    default-fetch-size: 100
    default-statement-timeout: 30

server:
  port: 3000
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# 상품이미지 업로드 저장 경로. 상대경로면 애플리케이션 실행 위치(working directory) 기준이다.
upload:
  dir: ${UPLOAD_DIR:uploads}

toss:
  secret-key: ${TOSS_SECRET_KEY:test_sk_DnyRpQWGrNzDwJAdkJ1OrKwv1M9E}

shop:
  # shop.html(자사 쇼핑몰) 체크아웃 주문에 부여할 채널코드. 환경별로 다를 수 있어 설정으로 분리.
  chnl-code: ${SHOP_CHNL_CODE:1208674775Z2}

shoplinker:
  # 샵링커 협력사 주문수집 API. 일반몰은 order.php, 오픈마켓은 order2.php.
  # 별도 인증키 없이 경로(cooper/shopion) + 등록된 몰 아이디로 인가된다.
  order-url:      ${SHOPLINKER_ORDER_URL:http://ad2.shoplinker.co.kr/cooper/shopion/order.php}
  order2-url:     ${SHOPLINKER_ORDER2_URL:http://ad2.shoplinker.co.kr/cooper/shopion/order2.php}
  timeout-sec:    ${SHOPLINKER_TIMEOUT_SEC:60}
